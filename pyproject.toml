[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingview-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server exposing market data, technical analysis, and backtesting tools powered by free Yahoo Finance data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "capitalslug-hue" }]
keywords = ["mcp", "tradingview", "trading", "backtesting", "technical-analysis", "finance"]

dependencies = [
    "mcp>=1.2.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
tradingview-mcp = "tradingview_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingview_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
